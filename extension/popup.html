<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=340" />
  <title>Twitch 1440p Relay</title>
  <link rel="stylesheet" href="popup.css" />
</head>

<body>
  <div class="container">
    <div class="header">
      <img src="icons/icon48.png" alt="Icon" class="logo" />
      <h1>Twitch 1440p</h1>
    </div>

    <div class="status-bar">
      <span id="status" class="status inactive">Disabled</span>
    </div>

    <div class="control-group">
      <div class="toggle-row">
        <label for="toggle">Enable bypass</label>
        <label class="switch">
          <input type="checkbox" id="toggle" />
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="control-group">
      <label for="relay-url" class="input-label">Relay URL</label>
      <input type="url" id="relay-url" placeholder="https://twitch-relay.you.workers.dev" spellcheck="false" />
    </div>

    <div class="control-group">
      <label for="relay-key" class="input-label">Relay key</label>
      <div class="key-row">
        <input type="password" id="relay-key" placeholder="RELAY_KEY" spellcheck="false" autocomplete="off" />
        <button type="button" id="key-reveal" class="small-btn">Show</button>
      </div>
      <p class="hint">
        Deploy your own <a href="#" id="setup-link">relay</a>, then paste its URL and key.
        Never use someone else's relay: it receives your Twitch session.
      </p>
    </div>

    <div class="control-group">
      <button type="button" id="test-btn" class="wide-btn">Test relay</button>
      <ul id="test-result" class="test-result" hidden></ul>
    </div>

    <div class="info-card">
      <p>
        Only the master playlist goes through your relay.
        Video streams stay direct. Refresh the stream after toggling.
      </p>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>

</html>
